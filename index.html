<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flipbook</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="stage">
    <div id="book" aria-label="Libro interactivo"></div>
    <div id="loading">Cargando páginas…</div>
  </main>

  <nav class="controls">
    <button id="btn-first" title="Portada">⏮</button>
    <button id="btn-prev"  title="Anterior (←)">◀</button>
    <span id="indicator">1 / 1</span>
    <button id="btn-next"  title="Siguiente (→)">▶</button>
    <button id="btn-last"  title="Contraportada">⏭</button>
    <button id="btn-full"  title="Pantalla completa">⛶</button>
  </nav>

  <!-- StPageFlip: usa la copia local si existe; si no, el CDN -->
<script src="js/vendor/page-flip.browser.js"></script>
  <script>window.St || document.write('<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"><\/script>')</script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
